[package]
name = "m-app"
version = "0.9.17"
edition = "2021"

[lib]
name = "m_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# tauri::generate_context!() writes the plugins section of tauri.conf.json (the updater settings) as serde_json values
serde = { version = "1", features = ["derive"] }
serde_json = "1"
