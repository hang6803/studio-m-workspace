name: Build Mac app
# Builds the Mac app (universal: Apple silicon + Intel) and publishes it as the GitHub Release "v<version>" with the .dmg,
# the update bundle and latest.json. The installed app reads latest.json to update itself (Settings → Updates).
# Run it from the Actions tab (Run workflow), or push a v* tag. Bump the version first: a release for a version that
# already exists is updated in place.
# Needs the secret TAURI_SIGNING_PRIVATE_KEY: the private half of the updater key (its public half is in tauri.conf.json).
# Updates that aren't signed with it are refused by the app.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - run: npm ci || npm install
      - run: npm test
      - run: npm run build:web
        env:
          M_API_URL: ${{ secrets.M_API_URL }}
      # The key is pasted into the secret by hand: spaces, line breaks and quotes picked up on the way are removed, and a
      # key that still isn't whole stops here in seconds (with its length, never its content) instead of after the build.
      # Both layers are checked: the file's base64, and the key inside it.
      - name: Check the signing key
        env:
          RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          k=$(printf %s "$RAW" | tr -d ' \r\n\t"'"'"'')
          echo "::add-mask::$k"
          if [ -z "$k" ]; then echo "::error::The secret TAURI_SIGNING_PRIVATE_KEY is empty."; exit 1; fi
          if ! K="$k" python3 -c 'import base64,os; t=base64.b64decode(os.environ["K"],validate=True).decode().splitlines(); assert "secret key" in t[0]; base64.b64decode(t[1],validate=True)' 2>/dev/null; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not a whole key: ${#k} characters after cleaning (a whole key is 348). Paste the whole file again, from a computer."; exit 1; fi
          echo "Signing key OK (${#k} characters)."
          echo "TAURI_SIGNING_PRIVATE_KEY=$k" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the key's own password. Not a secret: the key it unlocks is. (A key with an empty password can't be read back
          # by this Tauri version: "Wrong password for that key".)
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: studio-m-updater
        with:
          tauriScript: npx tauri
          args: --target universal-apple-darwin
          tagName: v__VERSION__
          releaseName: M app v__VERSION__
          releaseBody: "What's new: see CHANGELOG.md. Install: open the .dmg and drag M app into Applications. Already installed: the app updates itself."
          releaseDraft: false
          prerelease: false
